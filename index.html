<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeingSure · Beingrich 대표</title>
    <meta
      name="description"
      content="책과 함께 크고 있습니다. 같이 크실 분? BeingSure, Beingrich 대표."
    />
    <meta name="theme-color" content="#101a16" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="stage">
      <article class="card" id="card" data-style="forest">
        <figure class="portrait">
          <img
            src="assets/portrait.jpg?v=smile"
            alt="모자와 안경을 쓴 BeingSure 캐릭터"
            width="1024"
            height="1024"
          />
          <figcaption>멋지게 성장하자</figcaption>
        </figure>

        <div class="panel">
          <p class="kicker">Beingrich</p>
          <h1 class="name">BeingSure</h1>
          <p class="role">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 6.2A2.2 2.2 0 0 1 6.7 4H19.5v14.2H6.7a2.2 2.2 0 0 0-2.2 2.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M4.5 6.2A2.2 2.2 0 0 1 6.7 8.4H19.5" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
            Beingrich 대표
          </p>
          <p class="intro">책과 함께 크고 있습니다.<br />같이 크실 분?</p>

          <div class="contacts">
            <a class="contact" href="mailto:soonjongy@gmail.com">soonjongy@gmail.com</a>
            <a class="contact" href="tel:+821024566150">010-2456-6150</a>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-fill" id="copy-email">이메일 복사</button>
            <button type="button" class="btn btn-line" id="save-contact">연락처 저장</button>
            <a class="btn btn-line" id="linkedin" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M6.2 9.4h2.5V18H6.2zM7.45 6a1.45 1.45 0 1 1 0 2.9 1.45 1.45 0 0 1 0-2.9zM11 9.4h2.4v1.17h.03c.34-.64 1.16-1.32 2.4-1.32 2.56 0 3.04 1.69 3.04 3.88V18h-2.5v-3.9c0-.93-.02-2.12-1.29-2.12-1.3 0-1.5 1.01-1.5 2.05V18H11z" />
              </svg>
              링크드인
            </a>
            <a class="btn btn-line" id="youtube" href="https://www.youtube.com/@ai-study" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M22 12.2s0-3.2-.4-4.6c-.2-.9-.9-1.6-1.8-1.8C18.2 5.4 12 5.4 12 5.4s-6.2 0-7.8.4c-.9.2-1.6.9-1.8 1.8C2 9 2 12.2 2 12.2s0 3.2.4 4.6c.2.9.9 1.6 1.8 1.8 1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.4.4-4.6.4-4.6zM10 15.5v-6.6l5.2 3.3L10 15.5z" />
              </svg>
              유튜브
            </a>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </article>
      </div>

      <section class="toolbar" aria-label="명함 모양">
        <div class="toolbar-row">
          <span class="toolbar-label" id="style-label">스타일</span>
          <div class="choices" role="group" aria-labelledby="style-label">
            <button type="button" class="choice" data-style="forest" aria-pressed="true">숲</button>
            <button type="button" class="choice" data-style="ink" aria-pressed="false">잉크</button>
            <button type="button" class="choice" data-style="sunset" aria-pressed="false">노을</button>
            <button type="button" class="choice" data-style="night" aria-pressed="false">밤</button>
          </div>
        </div>
        <div class="toolbar-row">
          <span class="toolbar-label" id="bg-label">배경</span>
          <div class="choices" role="group" aria-labelledby="bg-label">
            <button type="button" class="swatch" data-bg="#101a16" style="--swatch:#101a16" aria-label="깊은 녹" aria-pressed="true"></button>
            <button type="button" class="swatch" data-bg="#1b2740" style="--swatch:#1b2740" aria-label="남색" aria-pressed="false"></button>
            <button type="button" class="swatch" data-bg="#3a241c" style="--swatch:#3a241c" aria-label="밤색" aria-pressed="false"></button>
            <button type="button" class="swatch" data-bg="#121418" style="--swatch:#121418" aria-label="먹색" aria-pressed="false"></button>
            <button type="button" class="swatch" data-bg="#e7e1d4" style="--swatch:#e7e1d4" aria-label="밝은 종이" aria-pressed="false"></button>
            <label class="bg-picker">
              배경색
              <input type="color" id="bg-picker" value="#101a16" aria-label="배경색 직접 고르기" />
            </label>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
